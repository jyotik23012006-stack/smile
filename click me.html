
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Important Question ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:linear-gradient(135deg,#87E0C3,#6DD5ED,#2193B0);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

}

.container{

    text-align:center;
    color:white;

}

h1{

    font-size:60px;
    margin-bottom:50px;
    text-shadow:2px 2px 8px rgba(0,0,0,.3);

}

button{

    padding:15px 40px;
    font-size:24px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    transition:.25s;

}

#yes{

    background:#4CAF50;
    color:white;
    margin-right:30px;

}

#yes:hover{

    transform:scale(1.1);

}

#no{

    background:#ff4b5c;
    color:white;
    position:absolute;

}

</style>

</head>

<body>

<div class="container">

<h1>🥺 Am I the Best? ❤️</h1>

<button id="yes" onclick="yesClicked()">YES 💛</button>

<button id="no">NO 😒</button>

</div>

<script>

const noBtn = document.getElementById("no");

// Initial position
noBtn.style.left = "60%";
noBtn.style.top = "55%";

// Move whenever the mouse gets close
document.addEventListener("mousemove", function(e){

    const rect = noBtn.getBoundingClientRect();

    const distance = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    if(distance < 120){

        const x = Math.random() * (window.innerWidth - 120);
        const y = Math.random() * (window.innerHeight - 60);

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

    }

});

function yesClicked(){

    alert("🥳 I knew it! You're the best friend too! 🌻💛");

    window.location.href="index.html";

}

</script>

</body>
</html>
