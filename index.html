<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Friendship Day :)  | My Website</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#87E0C3,#6DD5ED,#2193B0);
    background-size:cover;
    background-repeat:no-repeat;
    color:white;
    overflow:hidden;
}

/* Navigation */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(8px);
}

nav h2{
    font-size:30px;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
    transition:.3s;
}

nav ul li a:hover{
    color:yellow;
}

/* Hero */

.hero{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:70px;
    margin-bottom:20px;
}

.hero p{
    font-size:22px;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    background:#ff4b5c;
    padding:15px 35px;
    border-radius:40px;
    font-size:20px;
    transition:.3s;
}

.btn:hover{
    background:#ff1e38;
    transform:scale(1.05);
}

footer{
    text-align:center;
    padding:20px;
    background:rgba(0,0,0,.2);
}

/* ========================= */
/* SUNFLOWER ANIMATION */
/* ========================= */

#sunflower-container{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:100%;
    overflow:hidden;
    pointer-events:none;
}

.sunflower{
    position:absolute;
    bottom:-60px;
    left:0;
    animation:floatUp linear forwards;
}

@keyframes floatUp{

0%{
    transform:translate(0,0) rotate(0deg);
    opacity:0;
}

10%{
    opacity:1;
}

50%{
    transform:translate(60px,-50vh) rotate(180deg);
}

100%{
    transform:translate(140px,-120vh) rotate(360deg);
    opacity:0;
}

}

@media(max-width:768px){

nav{
    flex-direction:column;
}

nav ul{
    margin-top:15px;
}

.hero h1{
    font-size:45px;
}

.hero p{
    font-size:18px;
}

}
    /* ===================================== */
/* RAINBOW CATERPILLAR */
/* ===================================== */

.rainbow-caterpillar{
    position:absolute;
    top:170px;
    left:-500px;
    display:flex;
    align-items:center;
    z-index:999;
    animation:crawl 20s linear infinite;
}

.head,
.body{
    width:38px;
    height:38px;
    border-radius:50%;
    margin-left:-7px;
    position:relative;
}

.head{
    background:#66bb6a;
}

/* Rainbow colors */

.red{background:#ff4d4d;}
.orange{background:#ff9800;}
.yellow{background:#ffd600;}
.green{background:#4caf50;}
.blue{background:#42a5f5;}
.indigo{background:#5c6bc0;}
.violet{background:#ab47bc;}

/* Eyes */

.eye{
    position:absolute;
    width:7px;
    height:7px;
    background:white;
    border-radius:50%;
    top:11px;
}

.left-eye{
    left:8px;
}

.right-eye{
    right:8px;
}

.eye::after{
    content:"";
    position:absolute;
    width:3px;
    height:3px;
    background:black;
    border-radius:50%;
    top:2px;
    left:2px;
}

/* Smile */

.head::after{
    content:"";
    position:absolute;
    width:14px;
    height:8px;
    border-bottom:3px solid #222;
    border-radius:0 0 15px 15px;
    left:12px;
    bottom:8px;
}

/* Antennae */

.antenna{
    position:absolute;
    width:3px;
    height:16px;
    background:#444;
    top:-12px;
}

.left-ant{
    left:9px;
    transform:rotate(-30deg);
}

.right-ant{
    right:9px;
    transform:rotate(30deg);
}

.antenna::after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    background:#ff69b4;
    border-radius:50%;
    top:-4px;
    left:-2px;
}

/* Wiggle */

.head{
    animation:wiggle .4s infinite alternate;
}

.body:nth-child(2){animation:wiggle .45s infinite alternate;}
.body:nth-child(3){animation:wiggle .5s infinite alternate;}
.body:nth-child(4){animation:wiggle .55s infinite alternate;}
.body:nth-child(5){animation:wiggle .6s infinite alternate;}
.body:nth-child(6){animation:wiggle .65s infinite alternate;}
.body:nth-child(7){animation:wiggle .7s infinite alternate;}
.body:nth-child(8){animation:wiggle .75s infinite alternate;}

@keyframes wiggle{

    from{
        transform:translateY(-4px);
    }

    to{
        transform:translateY(4px);
    }

}

@keyframes crawl{

    0%{
        left:-500px;
    }

    100%{
        left:110%;
    }

}

</style>

</head>

<body>

<!-- Sunflower Container -->
<div id="sunflower-container"></div>

<nav>

<h2>🌐 Hieeee Jyoti here.......🌻</h2>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Gallery</a></li>
<li><a href="#">Contact</a></li>
</ul>

</nav>
    <div class="rainbow-caterpillar">

    <div class="head">

        <div class="eye left-eye"></div>
        <div class="eye right-eye"></div>

        <div class="antenna left-ant"></div>
        <div class="antenna right-ant"></div>

    </div>

    <div class="body red"></div>
    <div class="body orange"></div>
    <div class="body yellow"></div>
    <div class="body green"></div>
    <div class="body blue"></div>
    <div class="body indigo"></div>
    <div class="body violet"></div>

</div>

<section class="hero">

<div>

<h1>H▲ppy friendship d▲y  </h1>

<p>You ▲re very lucky to have me ▲s your friend</p>

<a href="#" class="btn">click me</a>

</div>

</section>

<footer>

<p>© 2026 My Website | Made with ❤️</p>

</footer>

<script>

const container = document.getElementById("sunflower-container");

function createFlower(){

    const flower = document.createElement("span");

    flower.className="sunflower";

    flower.innerHTML="🌻";

    // Random size
    const size = Math.random()*25 + 30;
    flower.style.fontSize=size+"px";

    // Bottom-left position
    flower.style.left=Math.random()*120+"px";

    // Random speed
    flower.style.animationDuration=(6+Math.random()*4)+"s";

    container.appendChild(flower);

    flower.addEventListener("animationend",()=>{
        flower.remove();
    });

}

setInterval(createFlower,400);

</script>

</body>
</html>
