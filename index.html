<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Happy Friendship Day :)  | My Website</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#87E0C3,#6DD5ED,#2193B0);
    background-size:cover;
    background-repeat:no-repeat;
    color:white;
    overflow:hidden;
}

/* Navigation */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(8px);
}

nav h2{
    font-size:30px;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
    transition:.3s;
}

nav ul li a:hover{
    color:yellow;
}

/* Hero */

.hero{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:70px;
    margin-bottom:20px;
}

.hero p{
    font-size:22px;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    background:#ff4b5c;
    padding:15px 35px;
    border-radius:40px;
    font-size:20px;
    transition:.3s;
}

.btn:hover{
    background:#ff1e38;
    transform:scale(1.05);
}

footer{
    text-align:center;
    padding:20px;
    background:rgba(0,0,0,.2);
}

/* ========================= */
/* SUNFLOWER ANIMATION */
/* ========================= */

#sunflower-container{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:100%;
    overflow:hidden;
    pointer-events:none;
}

.sunflower{
    position:absolute;
    bottom:-60px;
    left:0;
    animation:floatUp linear forwards;
}

@keyframes floatUp{

0%{
    transform:translate(0,0) rotate(0deg);
    opacity:0;
}

10%{
    opacity:1;
}

50%{
    transform:translate(60px,-50vh) rotate(180deg);
}

100%{
    transform:translate(140px,-120vh) rotate(360deg);
    opacity:0;
}

}

@media(max-width:768px){

nav{
    flex-direction:column;
}

nav ul{
    margin-top:15px;
}

.hero h1{
    font-size:45px;
}

.hero p{
    font-size:18px;
}

}
    .rainbow-caterpillar{
    position:absolute;
    top:290px;
    left:-450px;
    display:flex;
    align-items:center;
    z-index:9999;
    animation:crawl 18s linear infinite;
}

.head,.body{
    width:35px;
    height:35px;
    border-radius:50%;
    margin-left:-6px;
    position:relative;
}

.head{
    background:#6BCB77;
}

.red{background:#ff595e;}
.orange{background:#ff924c;}
.yellow{background:#ffca3a;}
.green{background:#8ac926;}
.blue{background:#1982c4;}
.indigo{background:#6a4c93;}
.violet{background:#d65db1;}

.eye{
    width:7px;
    height:7px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:10px;
}

.left-eye{left:8px;}
.right-eye{right:8px;}

.eye::after{
    content:"";
    position:absolute;
    width:3px;
    height:3px;
    background:black;
    border-radius:50%;
    left:2px;
    top:2px;
}

.head::after{
    content:"";
    position:absolute;
    width:12px;
    height:6px;
    border-bottom:2px solid black;
    left:11px;
    bottom:8px;
    border-radius:50%;
}

.antenna{
    width:2px;
    height:15px;
    background:#444;
    position:absolute;
    top:-10px;
}

.left-ant{
    left:10px;
    transform:rotate(-25deg);
}

.right-ant{
    right:10px;
    transform:rotate(25deg);
}

.antenna::after{
    content:"";
    width:7px;
    height:7px;
    background:#ff69b4;
    border-radius:50%;
    position:absolute;
    top:-5px;
    left:-2px;
}

.body{
    animation:wave .8s infinite ease-in-out;
}

.body:nth-child(2){animation-delay:.1s;}
.body:nth-child(3){animation-delay:.2s;}
.body:nth-child(4){animation-delay:.3s;}
.body:nth-child(5){animation-delay:.4s;}
.body:nth-child(6){animation-delay:.5s;}
.body:nth-child(7){animation-delay:.6s;}
.body:nth-child(8){animation-delay:.7s;}

@keyframes wave{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

@keyframes crawl{
    from{
        left:-450px;
    }
    to{
        left:110%;
    }
}

   





 


</style>

</head>

<nav>

    <div class="body red"></div>

    <div class="body yellow"></div>

</div>

<section class="hero">

<p>© 2026 My Website | Made with ❤️</p>

<script>

const container = document.getElementById("sunflower-container");

function createFlower(){

    const flower = document.createElement("span");

    flower.className="sunflower";

    flower.innerHTML="🌻";

    // Random size
    const size = Math.random()*25 + 30;
    flower.style.fontSize=size+"px";

    // Bottom-left position
    flower.style.left=Math.random()*120+"px";

    // Random speed
    flower.style.animationDuration=(6+Math.random()*4)+"s";

    container.appendChild(flower);

    flower.addEventListener("animationend",()=>{
        flower.remove();
    });

}

setInterval(createFlower,400);

</script>

</body>
</html>
