<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact 📞</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#87E0C3,#6DD5ED,#2193B0);
    overflow:hidden;
}

.card{

    width:700px;
    max-width:90%;
    padding:50px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    text-align:center;
    color:white;
    box-shadow:0 10px 25px rgba(0,0,0,.2);

}

h1{

    font-size:48px;
    margin-bottom:25px;

}

.line{

    font-size:28px;
    margin:15px 0;
    opacity:0;
    animation:appear .8s forwards;

}

.line:nth-child(2){animation-delay:1s;}
.line:nth-child(3){animation-delay:2s;}
.line:nth-child(4){animation-delay:3s;}
.line:nth-child(5){animation-delay:4s;}
.line:nth-child(6){animation-delay:5s;}
.line:nth-child(7){animation-delay:6s;}

.reason{

    font-size:30px;
    color:yellow;
    margin-top:20px;

}

button{

    margin-top:40px;
    padding:15px 35px;
    border:none;
    border-radius:40px;
    font-size:20px;
    background:#ff4b5c;
    color:white;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    transform:scale(1.08);
    background:#ff1e38;

}

@keyframes appear{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>

</head>

<body>

<div class="card">

<h1>📞 Contact Us</h1>

<div class="line">📡 Connecting...</div>

<div class="line">Searching Network...</div>

<div class="line">Searching Network...</div>

<div class="line">Searching Network...</div>

<div class="line">❌ No Signal</div>

<div class="line reason">
Reason:<br><br>

ECE student is currently bunking the lecture... 😎<br>
Well... someone actually reached the classroom even after the mass bunk announcement! 🤦😂😂
</div>

<button onclick="location.href='index.html'">
⬅ Back to Friendship
</button>

</div>

</body>
</html>
